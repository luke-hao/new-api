<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/kele-mascot.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>可乐AI</title>
    <meta name="title" content="可乐AI" />
    <meta
      name="description"
      content="可乐AI统一接入主流文本、编程、图片与视频模型，提供稳定、低延迟的企业级 AI API 服务。"
    />

    <meta name="theme-color" content="#07111f" />
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        background: #070b12;
      }

      .boot-shell {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        overflow: hidden;
        background: #070b12;
        color: #f8fafc;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      .boot-shell__header {
        display: flex;
        height: 64px;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding: 0 5vw;
      }

      .boot-shell__brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 17px;
        font-weight: 700;
      }

      .boot-shell__mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid rgba(34, 211, 238, 0.45);
        border-radius: 6px;
        background: #0b1726;
        color: #67e8f9;
        font-size: 14px;
      }

      .boot-shell__nav,
      .boot-shell__actions {
        display: flex;
        align-items: center;
        gap: 18px;
      }

      .boot-shell__line {
        display: block;
        height: 8px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.13);
        animation: boot-pulse 1.2s ease-in-out infinite alternate;
      }

      .boot-shell__main {
        display: grid;
        min-height: calc(100vh - 65px);
        grid-template-columns: minmax(0, 1fr) minmax(320px, 0.85fr);
        align-items: center;
        gap: 7vw;
        box-sizing: border-box;
        max-width: 1280px;
        margin: 0 auto;
        padding: 7vh 5vw 12vh;
      }

      .boot-shell__eyebrow {
        width: 118px;
        background: rgba(34, 211, 238, 0.36);
      }

      .boot-shell__title {
        height: 42px;
        max-width: 560px;
        margin-top: 28px;
        background: rgba(248, 250, 252, 0.2);
      }

      .boot-shell__title--short {
        width: 72%;
        margin-top: 14px;
      }

      .boot-shell__copy {
        width: 82%;
        margin-top: 30px;
      }

      .boot-shell__copy--short {
        width: 58%;
        margin-top: 12px;
      }

      .boot-shell__buttons {
        display: flex;
        gap: 12px;
        margin-top: 34px;
      }

      .boot-shell__button {
        width: 126px;
        height: 38px;
        border: 1px solid rgba(96, 165, 250, 0.34);
        border-radius: 6px;
        background: rgba(37, 99, 235, 0.24);
      }

      .boot-shell__button--secondary {
        width: 104px;
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
      }

      .boot-shell__network {
        position: relative;
        aspect-ratio: 1;
        max-width: 430px;
        width: 100%;
        justify-self: end;
        border: 1px solid rgba(96, 165, 250, 0.16);
        border-radius: 50%;
      }

      .boot-shell__network::before,
      .boot-shell__network::after {
        position: absolute;
        content: '';
        border: 1px solid rgba(34, 211, 238, 0.14);
        border-radius: 50%;
      }

      .boot-shell__network::before {
        inset: 18%;
      }

      .boot-shell__network::after {
        inset: 37%;
        background: #0b1726;
      }

      .boot-shell__node {
        position: absolute;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #22d3ee;
        box-shadow: 0 0 14px rgba(34, 211, 238, 0.65);
        animation: boot-pulse 1.2s ease-in-out infinite alternate;
      }

      @keyframes boot-pulse {
        from {
          opacity: 0.45;
        }
        to {
          opacity: 1;
        }
      }

      @media (max-width: 760px) {
        .boot-shell__header {
          padding: 0 20px;
        }

        .boot-shell__nav {
          display: none;
        }

        .boot-shell__main {
          grid-template-columns: 1fr;
          align-content: center;
          min-height: calc(100vh - 65px);
          padding: 48px 24px 96px;
        }

        .boot-shell__network {
          display: none;
        }

        .boot-shell__title {
          height: 34px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-shell__line,
        .boot-shell__node {
          animation: none;
        }
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="boot-shell" class="boot-shell" aria-hidden="true">
      <header class="boot-shell__header">
        <div class="boot-shell__brand">
          <span class="boot-shell__mark">K</span>
          <span>可乐AI</span>
        </div>
        <div class="boot-shell__nav">
          <span class="boot-shell__line" style="width: 48px"></span>
          <span class="boot-shell__line" style="width: 64px"></span>
          <span class="boot-shell__line" style="width: 52px"></span>
        </div>
        <div class="boot-shell__actions">
          <span class="boot-shell__line" style="width: 72px"></span>
        </div>
      </header>
      <main class="boot-shell__main">
        <div>
          <span class="boot-shell__line boot-shell__eyebrow"></span>
          <span class="boot-shell__line boot-shell__title"></span>
          <span
            class="boot-shell__line boot-shell__title boot-shell__title--short"
          ></span>
          <span class="boot-shell__line boot-shell__copy"></span>
          <span
            class="boot-shell__line boot-shell__copy boot-shell__copy--short"
          ></span>
          <div class="boot-shell__buttons">
            <span class="boot-shell__button"></span>
            <span
              class="boot-shell__button boot-shell__button--secondary"
            ></span>
          </div>
        </div>
        <div class="boot-shell__network">
          <span class="boot-shell__node" style="top: 15%; left: 48%"></span>
          <span class="boot-shell__node" style="top: 47%; right: 8%"></span>
          <span class="boot-shell__node" style="bottom: 12%; left: 31%"></span>
          <span class="boot-shell__node" style="top: 40%; left: 6%"></span>
        </div>
      </main>
    </div>
    <div id="root"></div>
    <script>
      ;(() => {
        const root = document.getElementById('root')
        const shell = document.getElementById('boot-shell')
        if (!root || !shell) return
        let dismissScheduled = false

        const dismiss = () => {
          const hasPageContent =
            Boolean(root.textContent?.trim()) ||
            Boolean(
              root.querySelector('main, header, nav, form, iframe, canvas')
            )
          if (!hasPageContent || dismissScheduled) return
          dismissScheduled = true
          observer.disconnect()
          window.setTimeout(() => {
            window.requestAnimationFrame(() => shell.remove())
          }, 900)
        }

        const observer = new MutationObserver(dismiss)
        observer.observe(root, { childList: true })
        dismiss()
      })()
    </script>
  </body>
</html>
